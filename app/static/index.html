<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zvočne knjige — lokalno</title>
<style>
  :root{
    color-scheme:light;
    --paper:#f6f3ee; --card:#fffdfa; --ink:#1b1a18; --muted:#6b655d;
    --rule:#d9d2c7; --accent:#a4441f; --accent-soft:#f0e2d9;
    --ok:#2f6b4f; --warn:#8a5a13; --err:#a12c2c;
    --r:10px; --shadow:0 1px 2px rgba(27,26,24,.06),0 8px 24px -18px rgba(27,26,24,.4);
  }
  @media (prefers-color-scheme:dark){
    :root{color-scheme:dark;--paper:#141312;--card:#1c1a18;--ink:#ece7df;--muted:#a49b8f;--rule:#33302c;
      --accent:#e08a5f;--accent-soft:#2b211b;--ok:#7fbf9c;--warn:#d7a45c;--err:#e08a8a;
      --shadow:0 1px 2px rgba(0,0,0,.4)}
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap}
  h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:600}
  .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
  .sub{color:var(--muted);font-size:14px;margin:2px 0 0}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-weight:650;margin:0;padding:16px 18px;border-bottom:1px solid var(--rule)}
  .add{padding:16px 18px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
  .add label{font-size:12.5px;color:var(--muted)}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;
    background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
  input[type=text]:focus-visible,button:focus-visible,input[type=file]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--rule);
    background:var(--card);color:var(--ink);padding:9px 14px;min-height:44px;touch-action:manipulation}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  button.danger{color:var(--err)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .books{list-style:none;margin:0;padding:0}
  .book{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);
    border-radius:0;background:transparent;padding:14px 18px;min-height:0}
  .book:last-child{border-bottom:0}
  .book[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .book b{display:block;font-weight:600;font-size:15px;line-height:1.35}
  .book span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .book .badge{display:inline-block}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;
    border:1px solid var(--rule);color:var(--muted);margin-top:6px}
  .badge.done{color:var(--ok);border-color:var(--ok)}
  .badge.error{color:var(--err);border-color:var(--err)}
  .badge.rendering,.badge.queued,.badge.extracting{color:var(--warn);border-color:var(--warn)}
  .detail{padding:18px}
  .detail h3{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
  .meta{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650;margin-bottom:10px}
  .checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (max-width:560px){.checks{grid-template-columns:1fr}}
  .check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;
    padding:10px 12px;background:var(--paper);font-size:14px}
  .check input{appearance:none;flex:0 0 auto;margin:2px 0 0;width:18px;height:18px;
    border:1.5px solid var(--muted);background:var(--card);cursor:pointer;position:relative}
  .check input[type=radio]{border-radius:50%}
  .check input[type=radio]:checked{border-color:var(--accent)}
  .check input[type=radio]:checked::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
  .check input[type=checkbox]{border-radius:5px}
  .check input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .check input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
    border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .check input:checked + span{color:var(--ink)}
  input[type=file]{font-size:13px;color:var(--muted);max-width:100%}
  input[type=file]::file-selector-button{font:inherit;font-size:13px;padding:8px 12px;margin-right:10px;
    border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
  input[type=file]::file-selector-button:hover{border-color:var(--muted)}
  .check small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .progress{height:8px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;overflow:hidden;margin:6px 0 8px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .statusline{font-size:13px;color:var(--muted);min-height:20px}
  audio{width:100%;margin:6px 0 14px}
  .chapters{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto;border-top:1px solid var(--rule)}
  .chapters button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);border-radius:0;
    background:transparent;padding:9px 4px;min-height:0;display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
  .chapters span{color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{padding:28px 18px;color:var(--muted);font-size:14px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="tag">lokalno · brez oblaka</p>
      <h1>Zvočne knjige</h1>
      <p class="sub">EPUB ali PDF → slovenski M4B. Tudi skenirane kopije. Vse ostane na tem računalniku.</p>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="lib-h">
      <h2 id="lib-h">Knjižnica</h2>
      <div class="add">
        <label for="path">Dodaj po poti</label>
        <div class="row">
          <input id="path" type="text" placeholder="/Users/…/knjiga.epub ali .pdf" autocomplete="off">
          <button id="addPath">Dodaj</button>
        </div>
        <label for="file">ali naloži datoteko</label>
        <input id="file" type="file" accept=".epub,.pdf,application/epub+zip,application/pdf">
      </div>
      <ul class="books" id="books"></ul>
    </section>

    <section class="panel" id="detail" aria-live="polite">
      <div class="empty" id="empty">Izberi knjigo ali dodaj novo.</div>
      <div id="bookView" hidden>
        <div class="detail">
          <h3 id="bookTitle"></h3>
          <p class="meta" id="bookMeta"></p>

          <fieldset>
            <legend>Nastavitve izdelave</legend>
            <div class="checks">
              <label class="check"><input type="radio" name="mode" value="minimal" checked>
                <span>Minimalni popravki <small>številke ostanejo številke — boljši naglas</small></span></label>
              <label class="check"><input type="radio" name="mode" value="full">
                <span>Polni popravki <small>številke izpisane z besedo</small></span></label>
              <label class="check"><input type="checkbox" id="names" checked>
                <span>Slovar imen <small>Mozart → Mocart, Bach → Bah</small></span></label>
              <label class="check"><input type="checkbox" id="pace">
                <span>Tempo in pavze <small>počasnejši tempo, daljše pavze</small></span></label>
              <label class="check"><input type="checkbox" id="studio">
                <span>Topel zvok in soba <small>EQ, kompresija, prostor</small></span></label>
              <label class="check"><input type="checkbox" id="stress">
                <span>Sloleks naglas <small>naglas iz slovarske baze, brezplačno</small></span></label>
            </div>
          </fieldset>

          <div class="actions">
            <button class="primary" id="render">Izdelaj zvočno knjigo</button>
            <button id="download" hidden>Prenesi M4B</button>
            <button class="danger" id="remove">Odstrani</button>
          </div>

          <div class="progress" id="progressWrap" hidden><i id="progressBar"></i></div>
          <p class="statusline" id="status" role="status" aria-live="polite"></p>

          <audio id="audio" controls preload="none" hidden></audio>
          <ul class="chapters" id="chapters" hidden></ul>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const state = { books: [], selected: null, job: null, timer: null };
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200);
}
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
function fmt(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return `${m} min ${s.toString().padStart(2, '0')} s`;
}

function renderBooks() {
  const list = $('books');
  list.innerHTML = state.books.length ? '' : '<li class="empty">Še ni knjig.</li>';
  for (const b of state.books) {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'book';
    btn.setAttribute('aria-current', String(b.id === state.selected));
    btn.innerHTML = `<b>${esc(b.title)}</b>
      <span>${b.chapters.length} poglavij${b.duration ? ' · ' + fmt(b.duration) : ''}</span>
      <span class="badge ${esc(b.status)}">${label(b.status)}</span>`;
    btn.addEventListener('click', () => select(b.id));
    li.appendChild(btn); list.appendChild(li);
  }
}
function label(s) {
  return {new:'novo', ready:'pripravljeno', extracting:'berem PDF', queued:'v vrsti',
          rendering:'izdelujem', done:'končano', error:'napaka'}[s] || s;
}

function renderDetail() {
  const b = state.books.find(x => x.id === state.selected);
  $('empty').hidden = !!b;
  $('bookView').hidden = !b;
  if (!b) return;
  $('bookTitle').textContent = b.title;
  $('bookMeta').textContent = `${b.chapters.length} poglavij` +
    (b.duration ? ` · ${fmt(b.duration)}` : '') + (b.error ? ` · ${b.error}` : '');

  const audio = $('audio');
  if (b.has_audio) {
    audio.hidden = false;
    audio.src = `/api/books/${b.id}/audio`;
    $('download').hidden = false;
    $('download').onclick = () => window.location.assign(`/api/books/${b.id}/audio`);
  } else {
    audio.hidden = true; audio.removeAttribute('src');
    $('download').hidden = true;
  }

  const ul = $('chapters');
  ul.hidden = !b.has_audio;
  ul.innerHTML = '';
  if (b.has_audio && b.chapters.length) {
    let t = 0;
    for (const ch of b.chapters) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.innerHTML = `<em style="font-style:normal">${esc(ch.title)}</em><span>${fmt(ch.duration)}</span>`;
      const start = t;
      btn.addEventListener('click', () => { audio.currentTime = start; audio.play(); });
      t += (ch.duration || 0) + 1.2;
      li.appendChild(btn); ul.appendChild(li);
    }
  }
}

function renderStatus() {
  const job = state.job;
  const wrap = $('progressWrap'), bar = $('progressBar'), status = $('status');
  if (!job) { wrap.hidden = true; status.textContent = ''; return; }
  if (job.status === 'error') {
    wrap.hidden = true; status.textContent = 'Napaka: ' + (job.error || 'neznana');
    return;
  }
  wrap.hidden = false;
  const total = job.total || 0, done = job.done || 0;
  bar.style.width = total ? `${Math.round(done / total * 100)}%` : '0%';
  if (job.status === 'done') {
    status.textContent = 'Končano.';
  } else {
    status.textContent = `${job.status === 'queued' ? 'V čakalni vrsti' : 'Izdelujem'} · ` +
      `${done}/${total || '?'} · ${job.message || ''}`;
  }
}

async function refresh() {
  state.books = await api('/api/books');
  if (!state.selected && state.books.length) state.selected = state.books[0].id;
  renderBooks(); renderDetail(); renderStatus();
}

async function select(id) {
  state.selected = id;
  state.job = null;
  renderBooks(); renderDetail();
  const b = state.books.find(x => x.id === id);
  if (b && (b.status === 'queued' || b.status === 'rendering' || b.status === 'extracting')) await watch();
}

async function watch() {
  clearInterval(state.timer);
  const jobId = state.job?.id;
  state.timer = setInterval(async () => {
    try {
      const books = await api('/api/books');
      state.books = books;
      const b = state.books.find(x => x.id === state.selected);
      if (state.job?.id) {
        state.job = await api(`/api/jobs/${state.job.id}`);
      } else if (b && (b.status === 'queued' || b.status === 'rendering' || b.status === 'extracting')) {
        const list = await api('/api/books');
        state.books = list;
      } else {
        clearInterval(state.timer); state.timer = null; state.job = null;
        renderBooks(); renderDetail(); renderStatus(); return;
      }
      renderBooks(); renderDetail(); renderStatus();
      if (state.job && ['done', 'error'].includes(state.job.status)) {
        clearInterval(state.timer); state.timer = null;
        setTimeout(refresh, 400);
      }
    } catch (e) { /* keep polling */ }
  }, 1200);
}

async function addPath() {
  const path = $('path').value.trim();
  if (!path) return;
  try {
    const book = await api('/api/books/path', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });
    $('path').value = '';
    await refresh(); select(book.id); toast('Knjiga dodana.');
  } catch (e) { toast(e.message); }
}

async function upload(file) {
  const fd = new FormData(); fd.append('file', file);
  try {
    const book = await api('/api/books/upload', {method: 'POST', body: fd});
    await refresh(); select(book.id); toast('Knjiga naložena.');
  } catch (e) { toast(e.message); }
}

async function startRender() {
  const b = state.books.find(x => x.id === state.selected);
  if (!b) return;
  const settings = {
    mode: document.querySelector('input[name=mode]:checked').value,
    names: $('names').checked, pace: $('pace').checked, studio: $('studio').checked,
    stress: $('stress').checked,
  };
  try {
    const {job_id} = await api(`/api/books/${b.id}/render`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(settings),
    });
    state.job = {id: job_id, status: 'queued', done: 0, total: b.chapters.length, message: ''};
    renderStatus(); watch(); toast('Izdelava se je začela.');
  } catch (e) { toast(e.message); }
}

async function removeBook() {
  const b = state.books.find(x => x.id === state.selected);
  if (!b) return;
  if (!confirm(`Odstranim »${b.title}« iz knjižnice? Datoteka ostane na disku.`)) return;
  try {
    await api(`/api/books/${b.id}`, {method: 'DELETE'});
    state.selected = null; await refresh(); toast('Odstranjeno.');
  } catch (e) { toast(e.message); }
}

$('addPath').addEventListener('click', addPath);
$('path').addEventListener('keydown', e => { if (e.key === 'Enter') addPath(); });
$('file').addEventListener('change', e => { if (e.target.files[0]) upload(e.target.files[0]); });
$('render').addEventListener('click', startRender);
$('remove').addEventListener('click', removeBook);

refresh().catch(e => toast(e.message));
</script>
</body>
</html>
